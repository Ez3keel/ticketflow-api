services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow_dev_only
    ports:
      - "5432:5432"
    volumes:
      - ticketflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticketflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticketflow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ticketflow-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC (what the Api/Worker export traces to)
      - "4318:4318"   # OTLP HTTP

  api:
    build:
      context: .
      dockerfile: src/TicketFlow.Api/Dockerfile
    container_name: ticketflow-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Container-to-container hostnames (the Docker network's internal DNS),
      # overriding appsettings.Development.json's "localhost" values -- those are
      # correct for `dotnet run` on the host, meaningless from inside a container.
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ticketflow;Username=ticketflow;Password=ticketflow_dev_only
      ConnectionStrings__Redis: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      Otel__OtlpEndpoint: http://jaeger:4317
      Jwt__SigningKey: 3glvz3kthqfCpxT9zP279NeAMI8ZYx2jQQrsK6HwI90=
    ports:
      - "5299:8080"

  worker:
    build:
      context: .
      dockerfile: src/TicketFlow.Worker/Dockerfile
    container_name: ticketflow-worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ticketflow;Username=ticketflow;Password=ticketflow_dev_only
      ConnectionStrings__Redis: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      Otel__OtlpEndpoint: http://jaeger:4317
      # See Program.cs: "localhost" (the dotnet-run default) would only be
      # reachable from inside this container, never from the host trying to scrape it.
      Otel__PrometheusListenerPrefix: http://+:9464/
    ports:
      - "9464:9464"

volumes:
  ticketflow-postgres-data:
